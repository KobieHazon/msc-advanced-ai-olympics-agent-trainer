[project]
name = "msc-advanced-ai-olympics-agent-trainer"
version = "1.0.0"
description = "Team-built PPO, DQN, and classifier agents for the IJCAI AI Olympics environment"
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [
    { name = "Kobie Hazon" },
    { name = "Ron Ben Shimol" },
    { name = "Shahar Bend" },
]
dependencies = [
    "gym==0.26.2",
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<2",
    "pillow>=9,<12",
    "pygame>=2.5,<3",
    "pyyaml>=6,<7",
    "tabulate>=0.9,<1",
    "tensorboard>=2.14,<3",
    "torch>=2.2,<3",
    "tqdm>=4.66,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
exclude = [
    "agents/random",
    "env",
    "olympics_engine",
    "run_log.py",
    "utils",
    "rl_trainer/algo",
    "rl_trainer/log_path.py",
    "rl_trainer/main.py",
    "rl_trainer/myDuelingDQN.py",
    "rl_trainer/train2avoid.py",
    "rl_trainer/train_on_subgame.py",
    "rl_trainer/rl-algo-competition",
    "rl_trainer/agent_trainer/agent_trainer_run.py",
    "rl_trainer/agent_trainer/atariAgentTrain.py",
    "rl_trainer/agent_trainer/atariAgentTrain2.py",
    "rl_trainer/agent_trainer/atariAgentTrainRon.py",
    "rl_trainer/agent_trainer/atariagent_shahar2.py",
    "rl_trainer/agent_trainer/dueling_dqn_agent.py",
    "rl_trainer/agent_trainer/my_dqn_agent.py",
]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
line-ending = "lf"
